interface:
  display_name: "A365 Provisioning"
  short_description: "Build and verify truthful Agent 365 provisioning"
  default_prompt: >-
    Read and follow docs/agent-guides/end-to-end-execution.md; preserve the product
    objective, authority, secure-input references and holds across this assignment.
    Use $a365-provisioning to resume from the documented provisioning checkpoint.
    Preserve implemented capability-only bootstrap and Settings-owned SIT/KYD/DLP,
    dedicated gateway-protection-admin-v1, delegated-Administrator registration,
    capability-bound verification and exact Ready dimensions. Read current live
    status from the deployment checkpoint, never from a skill's historical claim.
