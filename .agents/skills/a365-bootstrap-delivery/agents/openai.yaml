interface:
  display_name: "A365 Bootstrap Delivery"
  short_description: "Run the evidence-bound bootstrap release gate"
  default_prompt: >-
    Use $a365-bootstrap-delivery to validate and resume CURRENT.json. If it is
    absent after a clone or pull, read tracked docs/agent-continuation.md and
    start a source-bound local ledger before continuing the exact unfinished
    action; never infer deployment state or authority from Git alone.
policy:
  allow_implicit_invocation: true
