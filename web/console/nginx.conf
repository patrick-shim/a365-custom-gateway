# A365 Gateway Console. ${GATEWAY_API_ORIGIN} is substituted by the nginx image's
# envsubst template processor at container start.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime configuration written by the entrypoint (never cached).
    location = /config.js {
        add_header Cache-Control "no-store";
        try_files /config.js =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Proxy API and health to the Gateway API over the same origin (no CORS).
    location /api/ {
        proxy_pass ${GATEWAY_API_ORIGIN};
        proxy_http_version 1.1;
        proxy_set_header Host ${GATEWAY_API_HOST};
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
    }
    location /health {
        proxy_pass ${GATEWAY_API_ORIGIN};
        proxy_http_version 1.1;
        proxy_set_header Host ${GATEWAY_API_HOST};
        proxy_ssl_server_name on;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
