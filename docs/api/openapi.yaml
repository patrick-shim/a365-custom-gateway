  /protection/operations/{operationId}:
    parameters:
      - $ref: '#/components/parameters/ProtectionOperationId'
    get:
      operationId: getProtectionAdminOperation
      summary: Read durable protection administration progress
      tags: [Protection administration]
      security:
        - entraBearer: [Gateway.Administrator, Gateway.Operator, Gateway.Auditor, Gateway.SupportReader]
      responses:
        '200':
          description: Tenant-bound operation and its ordered version-1 steps
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtectionAdminOperationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /agents/{agentId}:
    parameters:
      - $ref: '#/components/parameters/AgentId'

    get:
      operationId: getAgent
      summary: Get agent details
      tags: [Agents]
      security:
        - entraBearer: [Gateway.Administrator, Gateway.Operator, Gateway.Auditor, Gateway.SupportReader]
      responses:
        '200':
          description: Agent details
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: deleteAgent
      summary: Delete a Gateway registration (async)
      description: |
        Starts asynchronous deletion of the Gateway registration. The selected
        blueprint, child Agent ID, Agent 365 Registry record, and other linked
        Microsoft resources are not changed by this operation.
      tags: [Agents]
      security:
        - entraBearer: [Gateway.Administrator]
      responses:
        '202':
          description: Deletion accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAgentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /agents/{agentId}/features:
    parameters:
      - $ref: '#/components/parameters/AgentId'

    patch:
      operationId: updateFeatures
      summary: Update agent feature configuration
      description: |
        Protection changes are idempotent and concurrency-bound: idempotencyKey and
        expectedRowVersion must be present and match canonical Idempotency-Key and
        If-Match headers. Purview enablement additionally requires the exact Ready,
        current DLP profile for the registration blueprint.
      tags: [Agents]
      security:
        - entraBearer: [Gateway.Administrator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFeaturesRequest'
      responses:
        '200':
          description: Features updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateFeaturesResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConcurrencyConflict'
        '422':
          description: Unsupported feature configuration
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /agents/{agentId}/credentials:
    parameters:
      - $ref: '#/components/parameters/AgentId'

    get:
      operationId: listAgentIngressCredentials
      summary: List safe Gateway credential metadata
      tags: [Agents]
      security:
        - entraBearer: [Gateway.Administrator]
      responses:
        '200':
          description: Credential metadata only; never clear keys, hashes, or salts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentIngressCredentialListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      operationId: issueAgentIngressCredential
      summary: Issue a replacement Gateway credential
      description: |
        Returns the clear API key exactly once. The response is marked
        Cache-Control: no-store and Pragma: no-cache. Deploy and verify the new key
        before revoking the old one. A lost successful response cannot be replayed;
        list safe metadata and issue another replacement.
      tags: [Agents]
      security:
        - entraBearer: [Gateway.Administrator]
      responses:
        '201':
          description: Replacement Gateway credential issued
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `no-store`.
            Pragma:
              schema:
                type: string
              description: Always `no-cache`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueAgentIngressCredentialResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConcurrencyConflict'

  /agents/{agentId}/credentials/{credentialId}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
      - name: credentialId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    delete:
      operationId: revokeAgentIngressCredential
      summary: Revoke a named Gateway credential
      description: |
        Idempotent when the owned credential is already revoked. Returns 404 when
        the credential is not owned by the route agent and 409 when revocation would
        remove the last unexpired, unrevoked credential.
      tags: [Agents]
      security:
        - entraBearer: [Gateway.Administrator]
      responses:
        '200':
          description: Credential revoked or already revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeAgentIngressCredentialResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Agent not found, or the named credential is not owned by this agent
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://gateway.example.com/problems/agent-ingress-credential-not-found
                title: Agent ingress credential not found.
                status: 404
                errorCode: AGENT_INGRESS_CREDENTIAL_NOT_FOUND
                correlationId: 3f2504e0-4f89-41d3-9a0c-0305e82c3301
        '409':
          description: Revocation would remove the last usable credential
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://gateway.example.com/problems/agent-ingress-credential-last-usable
                title: The last usable Gateway credential cannot be revoked.
                status: 409
                errorCode: AGENT_INGRESS_CREDENTIAL_LAST_USABLE
                correlationId: 3f2504e0-4f89-41d3-9a0c-0305e82c3301

  /agents/{agentId}:enable:
    parameters:
      - $ref: '#/components/parameters/AgentId'

    post:
      operationId: enableAgent
      summary: Enable an agent
      tags: [Agents]
      security:
        - entraBearer: [Gateway.Administrator, Gateway.Operator]
      responses:
        '200':
          description: Agent enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentStateChangeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Invalid state transition
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /agents/{agentId}:disable:
    parameters:
      - $ref: '#/components/parameters/AgentId'

    post:
      operationId: disableAgent
      summary: Disable an agent
      tags: [Agents]
      security:
        - entraBearer: [Gateway.Administrator, Gateway.Operator]
      responses:
        '200':
          description: Agent disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentStateChangeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Invalid state transition
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /agents/{agentId}:retry-provisioning:
    parameters:
      - $ref: '#/components/parameters/AgentId'

    post:
      operationId: retryProvisioning
      summary: Retry failed provisioning
      description: |
        Failed status is necessary but not sufficient. The latest server-computed
        retryProvisioning decision must have supported=true, and the endpoint
        re-evaluates that decision before persistence. Legacy workflows, manual-
        intervention outcomes, active operations, and ambiguous or in-flight preview
        Registry creates fail closed and must not be replayed. The request also
        fails before persistence when deployment-level provisioning execution is
        disabled.
      tags: [Agents]
      security:
        - entraBearer: [Gateway.Administrator]
      responses:
        '202':
          description: Retry accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncOperationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Retry is not currently safe: the agent is not Failed or the server-
            computed retry eligibility is unsupported, including legacy, manual-
            intervention, active-operation, and ambiguous/in-flight Registry cases.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          $ref: '#/components/responses/ProvisioningDisabled'

  /operations/{operationId}:
    parameters:
      - name: operationId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getOperation
      summary: Get operation status
      tags: [Operations]
      security:
        - entraBearer: [Gateway.Administrator, Gateway.Operator]
      responses:
        '200':
          description: Operation status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /operations/{operationId}:complete-agent365-registration:
    parameters:
      - name: operationId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      operationId: completeAgent365Registration
      summary: Complete the Agent 365 Registry stage as the signed-in administrator
      description: |
        Workflow-v3 administrator action. The Gateway API validates the caller's
        user-bound access_as_user token and Gateway.Administrator role, acquires a
        Microsoft Graph token through OBO, and performs at most one preview Registry
        create. A creator-bound planned Registry ID is persisted first and included
        in the CLI-compatible payload with the reviewed preview-provider
        managedByAppId. The safe Registry ID returned with HTTP 201 is persisted as
        the accepted create boundary, with the planned ID used only when a successful
        response omits it; immediate exact GET is not required from the preview
        collection. An unknown post-create outcome permits exact planned-ID GET-only
        reconciliation and never repeats the POST. Historical v1/v2
        operations are rejected before token acquisition or Microsoft mutation.
        The deployment must explicitly enable the authenticated
        continuous-development delegated action. Other deployment profiles keep the
        preview Registry boundary closed.
      tags: [Operations]
      security:
        - entraBearer: [Gateway.Administrator, access_as_user]
      responses:
        '200':
          description: Registry create accepted and final worker verification queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteAgent365RegistrationResponse'
        '401':
          description: Sign-in, consent, or Conditional Access challenge required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Legacy/invalid state or an ambiguous Registry boundary
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          $ref: '#/components/responses/ProvisioningDisabled'

  /agents/{agentId}/audit-events:
    parameters:
      - $ref: '#/components/parameters/AgentId'

    get:
      operationId: getAuditEvents
      summary: Get agent audit history
      tags: [Audit]
      security:
        - entraBearer: [Gateway.Administrator, Gateway.Auditor]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /agents/{agentId}/provisioning-history:
    parameters:
      - $ref: '#/components/parameters/AgentId'

    get:
      operationId: getProvisioningHistory
      summary: Get provisioning job history
      tags: [Audit]
      security:
        - entraBearer: [Gateway.Administrator, Gateway.Operator]
      responses:
        '200':
          description: Provisioning history for the selected registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisioningHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /system/config:
    get:
      operationId: getSystemConfig
      summary: Get system configuration
      tags: [System]
      security:
        - entraBearer: [Gateway.Administrator]
      responses:
        '200':
          description: System configuration
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    patch:
      operationId: updateSystemConfig
      summary: Update system configuration
      description: |
        Updates implemented registration defaults, idempotency-record lifetime,
        and SQL-backed ingress rate limits. Persisted compatibility properties must
        be omitted or null; a non-null write is rejected rather than accepted as a
        control with no runtime effect. A change to a Prompt Shields or Purview
        default additionally requires matching Idempotency-Key/idempotencyKey and
        If-Match/expectedRowVersion values.
      tags: [System]
      security:
        - entraBearer: [Gateway.Administrator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSystemConfigRequest'
      responses:
        '200':
          description: Configuration updated
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfig'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ConcurrencyConflict'

  /health:
    get:
      operationId: healthCheck
      summary: Liveness health check
      tags: [System]
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [Healthy]

  /health/ready:
    get:
      operationId: readinessCheck
      summary: Readiness health check
      description: Checks whether the Gateway database is reachable.
      tags: [System]
      security: []
      responses:
        '200':
          description: Database is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Database is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'

  /agent-runtime/readiness:
    get:
      operationId: agentRuntimeReadiness
      summary: Verify a registration-bound Gateway API key
      description: |
        Gateway-owned, non-mutating readiness probe. Returns 204 only when the
        presented per-registration Gateway API key is valid, unexpired, unrevoked,
        and resolves to a non-deleted registration. This proves ingress credential
        validation only; it does not prove Agent 365 provisioning or system health.
        Registration status is intentionally not an `Active` gate here; ingestion
        endpoints enforce operational status separately.
      tags: [Agent Runtime]
      security:
        - gatewayAgentApiKey: []
      responses:
        '204':
          description: Gateway agent credential is valid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /agent-activities:
    post:
      operationId: submitActivity
      summary: Submit a single agent activity
      description: |
        Data-plane endpoint. Requires the unique Gateway API key issued for the
        registration. The key resolves the server-side registration and the body
        externalAgentId is cross-checked; the body identifier is never authentication.

        When Agent 365 observability is enabled for the registered agent,
        actor.type must be User and actor.tenantUserObjectId must be a non-empty
        Microsoft Entra object ID. An unsupported actor type or a missing/invalid
        object ID fails validation with HTTP 400 before the activity is persisted
        or queued. Agent and System actors remain supported when Agent 365 is not
        a destination (Disabled or GatewayOnly).

        Agent-to-agent attribution is not represented by this request contract.
        It needs dedicated caller-agent identity fields before it can be exported
        safely to Agent 365; callers must not label an agent as a human User.

        Gateway API designed for this solution, not a Microsoft API.
      tags: [Activities]
      security:
        - gatewayAgentApiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - name: X-Correlation-ID
          in: header
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitActivityRequest'
      responses:
        '202':
          description: Activity accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityReceipt'
        '400':
          description: |
            Request validation failed. When Agent 365 observability is enabled,
            this includes actor.type values other than User and a missing, empty,
            or invalid actor.tenantUserObjectId.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Identity mismatch or agent disabled
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Idempotency conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '413':
          description: Payload too large
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /agent-activities:batch:
    post:
      operationId: submitActivityBatch
      summary: Submit a batch of agent activities
      description: |
        Max 100 events per batch, max 1 MB request body.
        Supports partial success — each item gets its own status.
        Idempotency is scoped to the caller registration, this batch endpoint, and
        the key; the canonical hash covers every submitted item in order.

        When Agent 365 observability is enabled, each item must set actor.type to
        User and supply a non-empty, valid Microsoft Entra object ID in
        actor.tenantUserObjectId. An item with another actor type or a missing,
        empty, or malformed object ID is returned as Rejected with code
        VALIDATION_FAILED while valid siblings continue to be accepted. Agent and
        System actors remain supported when Agent 365 is not a destination.

        Agent-to-agent attribution needs dedicated caller-agent identity fields
        that are not yet represented by this request contract.
      tags: [Activities]
      security:
        - gatewayAgentApiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchActivityRequest'
      responses:
        '202':
          description: Batch processed; the body may contain accepted and rejected items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchActivityResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Identity mismatch or agent disabled
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Same scoped Idempotency-Key with a different canonical batch payload
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '413':
          description: Payload too large
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /prompts:evaluate:
    post:
      operationId: evaluatePrompt
      summary: Evaluate a prompt before model execution
      description: |
        Runs the controls enabled for the authenticated registration before the
        external client calls its model. Prompt Shields detects prompt-injection
        attacks. Purview evaluates the prompt against the registration's policy
        context. The Gateway fails closed when an enabled provider cannot return a
        trusted result and never persists the raw prompt in the evaluation table.

        HTTP 200 returns an allowed result and a short-lived, single-use receipt.
        The client must submit that receipt with the same registration, interaction
        ID, tenant user, content type, and exact prompt when it later calls
        /ai-interactions. HTTP 403 returns safe RFC 9457 details for a blocked prompt,
        including a machine-readable reason that the client can display without
        exposing provider response bodies.
      tags: [Prompt protection]
      security:
        - gatewayAgentApiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluatePromptRequest'
      responses:
        '200':
          description: Prompt passed every enabled protection control
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptEvaluationResult'
        '400':
          description: Request or idempotency-key validation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Prompt blocked, identity mismatch, or agent disabled
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Same scoped Idempotency-Key with a different prompt payload
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /ai-interactions:
    post:
      operationId: submitInteraction
      summary: Submit a completed AI interaction
      description: |
        Accepts a completed prompt/response pair. A registration with Prompt Shields
        or Purview enabled must first obtain a matching single-use receipt from
        /prompts:evaluate. When Purview AuditOnly is enabled,
        the Gateway synchronously submits metadata-only content activities before
        persistence. When Purview Enforce is enabled, policy is computed for the
        selected reusable blueprint application and each activity follows its
        returned mode: evaluateInline waits for a decision; evaluateOffline requires
        successful submission without a synchronous verdict. A policy block is
        represented by a 202 receipt with status Failed and Purview status Blocked;
        accepted mixed/offline processing returns AuditLogged. This endpoint is not
        the response-side policy path is not a model-call gate because model execution
        has already occurred in the external runtime. Prompt evaluation is the
        separate pre-model gate.

        When Agent 365 observability or Purview is enabled for the registered agent,
        userContext.tenantUserObjectId must be a non-empty Microsoft Entra object
        ID. A missing or invalid value fails validation with HTTP 400 before the
        interaction is persisted or queued.
      tags: [Interactions]
      security:
        - gatewayAgentApiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitInteractionRequest'
      responses:
        '202':
          description: Interaction accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractionReceipt'
        '400':
          description: |
            Request validation failed. This includes a missing, empty, or invalid
            userContext.tenantUserObjectId when Agent 365 observability is enabled.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Identity mismatch, agent disabled, or invalid/missing prompt evaluation receipt
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Idempotency conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    entraBearer:
      type: oauth2
      description: |
        Microsoft Entra ID OAuth 2.0 for Gateway control-plane users. Data-plane
        callers use gatewayAgentApiKey instead.
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/{tenantId}/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/{tenantId}/oauth2/v2.0/token
          scopes:
            Gateway.Administrator: Full control-plane access
            Gateway.Operator: Enable/disable agents and view provisioning status
            Gateway.Auditor: Read-only audit access
            Gateway.SupportReader: Health/diagnostics with redaction
    gatewayAgentApiKey:
      type: http
      scheme: bearer
      bearerFormat: A365 Gateway agent API key
      description: |
        Unique per-registration credential returned once by POST /agents (or a
        rotation operation). Send `Authorization: Bearer <gatewayCredential.apiKey>`.
        The clear key must never be placed in a URL, request body, log, or persistent
        browser storage. The Gateway stores only a salted hash and binds a valid key
        to exactly one registration.

  parameters:
    AgentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

    Cursor:
      name: cursor
      in: query
      description: Opaque pagination cursor from previous response
      schema:
        type: string

    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Scoped by authenticated AgentRegistrationId and normalized endpoint. The
        same value may be used independently by another registration or endpoint.
        Batch canonicalization preserves item order. Secret issuance responses are
        excluded from idempotency storage.
      schema:
        type: string
        format: uuid

    ProtectionIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Canonical UUIDv4 that must exactly match the body idempotencyKey. It is
        scoped to the exact tenant, reviewed protection operation, and endpoint.
      schema:
        type: string
        format: uuid

    ProtectionIfMatch:
      name: If-Match
      in: header
      required: true
      description: Must exactly match the opaque expectedRowVersion in the body.
      schema:
        type: string

    ProtectionOperationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PurviewDlpProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    AgentStatus:
      type: string
      enum: [Draft, Provisioning, AwaitingAdminApproval, Active, Disabled, Failed, Deleting, Deleted, RequiresManualIntervention]

    Environment:
      type: string
      enum: [Development, Test, Production]

    ObservabilityMode:
      type: string
      deprecated: true
      description: |
        Backward-compatible encoding of the two independent agent telemetry
        destinations. New clients should use agent365ObservabilityEnabled and
        azureMonitorExportEnabled instead.

        Disabled = neither destination; GatewayOnly = Azure Monitor only;
        Agent365 = Agent 365 only; Agent365AzureMonitor = both destinations.
      enum: [Disabled, GatewayOnly, Agent365, Agent365AzureMonitor]

    PurviewMode:
      type: string
      enum: [AuditOnly, Enforce]

    ActivityType:
      type: string
      enum: [ToolInvocation, Chat, InvokeAgent, OutputMessages, Custom]

    ActorType:
      type: string
      description: |
        User is required when Agent 365 observability is a destination. Agent and
        System are supported only when Agent 365 export is disabled. Agent-to-agent
        export needs caller-agent identity fields that this contract does not yet
        expose.
      enum: [Agent, User, System]

    ToolOutcome:
      type: string
      enum: [Succeeded, Failed, Cancelled]

    OperationType:
      type: string
      enum: [ProvisionAgent, DeleteAgent, RetryProvisioning, ReconcileAgent]

    OperationStatus:
      type: object
      description: |
        Persisted Gateway operation state. Workflow version 3 is current only when
        the exact seven-stage sequence is present. Every other version/shape is
        legacy and non-resumable.

        After AssignAgent365Access, the worker pauses at 71% with
        requiredAction=CompleteAgent365Registration. The signed-in administrator
        completes Registry creation through the Gateway API, after which the worker
        performs final connection verification.

        VerifyAgent365Connection includes child-Agent-ID token validation for Agent
        365 observability through the Gateway-worker FIC. Gateway-key readiness is
        proven through authorized use and revocation on a real registration.
      required:
        - operationId
        - type
        - status
        - percentComplete
        - agentId
        - startedAtUtc
        - workflowVersion
        - legacy
        - replaySupported
        - pollingRecommended
        - agent365RegistrationCompletionAvailable
      properties:
        operationId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/OperationType'
        status:
          type: string
          enum: [Pending, Running, AwaitingAdministratorAction, Completed, Failed, RequiresManualIntervention]
        currentStep:
          type: string
          nullable: true
        percentComplete:
          type: integer
          minimum: 0
          maximum: 100
        agentId:
          type: string
          format: uuid
        startedAtUtc:
          type: string
          format: date-time
        completedAtUtc:
          type: string
          format: date-time
          nullable: true
        error:
          $ref: '#/components/schemas/OperationError'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/OperationStep'
        workflowVersion:
          type: integer
          description: Exact persisted workflow contract version; current is 3.
          example: 3
        legacy:
          type: boolean
          description: True when version and ordered steps do not exactly match workflow v3.
        replaySupported:
          type: boolean
          description: |
            False for legacy jobs, manual-intervention outcomes, ambiguous Registry
            mutations, and an in-flight Registry create whose outcome is not yet
            durably known. This flag never authorizes DLQ replay.
        pollingRecommended:
          type: boolean
          description: True only for a nonterminal exact-current workflow that is not awaiting administrator action.
        requiredAction:
          type: string
          nullable: true
          enum: [CompleteAgent365Registration]
          description: Explicit user action required before the workflow can continue.
        agent365RegistrationCompletionAvailable:
          type: boolean
          description: |
            True only when this operation requires the Administrator Registry action
            and the deployment has explicitly opened that delegated action boundary.

    CompleteAgent365RegistrationResponse:
      type: object
      required: [operationId, agentId, agent365RegistrationId, status]
      properties:
        operationId:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        agent365RegistrationId:
          type: string
          description: Durable Agent 365 Registry identifier returned or confirmed by the delegated create boundary.
        status:
          type: string
          enum: [VerificationQueued]

    OperationError:
      type: object
      nullable: true
      properties:
        code:
          type: string
        message:
          type: string

    OperationStep:
      type: object
      required: [step, status]
      properties:
        step:
          type: string
        status:
          type: string
          enum: [Pending, Running, Completed, Failed, Skipped]
        completedAtUtc:
          type: string
          format: date-time
          nullable: true

    AgentFeatures:
      type: object
      description: |
        Per-agent feature settings. Agent 365 observability and the optional Azure
        Monitor mirror are independent. Gateway/platform diagnostics are not
        controlled by these fields, and Microsoft Purview is configured separately.

        If observabilityMode is supplied together with either destination boolean,
        the supplied values must describe the same combination.
      properties:
        observabilityMode:
          deprecated: true
          description: Deprecated compatibility field for older clients.
          allOf:
            - $ref: '#/components/schemas/ObservabilityMode'
        agent365ObservabilityEnabled:
          type: boolean
          default: true
          description: |
            Sends sanitized agent metrics and traces to Agent 365 observability.
            New registrations use the configured system default, initially true.
        azureMonitorExportEnabled:
          type: boolean
          default: false
          description: |
            Optionally mirrors sanitized agent metrics and traces to Azure Monitor /
            Application Insights. New registrations use the configured system
            default, initially false.
        purviewEnabled:
          type: boolean
        purviewMode:
          $ref: '#/components/schemas/PurviewMode'
        promptShieldEnabled:
          type: boolean
          description: Runs Azure AI Content Safety Prompt Shields before model execution.
        purviewDlpProfile:
          $ref: '#/components/schemas/PurviewDlpProfileSelection'
        purviewEffectivelyEnabled:
          type: boolean
          readOnly: true
          description: True only while the selected exact-blueprint profile is fully Ready and current.
        purviewReadiness:
          readOnly: true
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ProtectionReadiness'
        promptShieldEffectivelyEnabled:
          type: boolean
          readOnly: true
        promptShieldCapabilityStatus:
          type: string
          readOnly: true
          nullable: true

    Agent365Info:
      type: object
      properties:
        agentId:
          type: string
          nullable: true
          description: Child Agent Identity application/client ID used as fmi_path; currently the same GUID as agentIdentityObjectId.
        blueprintId:
          type: string
          nullable: true
          description: |
            Typed Agent Identity Blueprint application/client ID (`appId`); its
            value may equal blueprintObjectId.
        instanceId:
          type: string
          nullable: true
          description: Agent 365 Registry record ID when direct Registry is enabled.
        agentIdentityObjectId:
          type: string
          format: uuid
          nullable: true
          description: Microsoft Entra object ID of the child Agent Identity; currently the same GUID as agentId.
        blueprintObjectId:
          type: string
          format: uuid
          nullable: true
          description: |
            Microsoft Entra Graph `id` of the typed Agent Identity Blueprint; its
            value may equal blueprintId.

    ProvisioningInfo:
      type: object
      required: [percentComplete]
      properties:
        currentStep:
          type: string
          nullable: true
        percentComplete:
          type: integer
        lastError:
          type: string
          nullable: true

    ProvisioningRetryEligibility:
      type: object
      required: [supported, reason]
      description: |
        Server-computed retry-safety decision. Clients must fail closed when this
        object is absent or supported is false; status alone is not sufficient.
      properties:
        supported:
          type: boolean
        reason:
          type: string
          description: Safe operator-facing explanation that contains no raw dependency error.

    AgentBlueprintSelection:
      type: object
      description: |
        Selects or creates a reusable typed Agent ID blueprint. Gateway federation
        is trusted worker configuration and never comes from this client contract.
        Ordinary Entra apps, including the Gateway API app, are not valid blueprints.
      required: [mode]
      properties:
        mode:
          type: string
          enum: [UseExisting, CreateNew]
        blueprintObjectId:
          type: string
          format: uuid
          nullable: true
          description: |
            Typed blueprint Graph `id` from the Gateway catalog. Required only for
            UseExisting. Its value may equal that item's `appId`; it is not an
            ordinary application object ID supplied outside the typed catalog.
        displayName:
          type: string
          minLength: 1
          maxLength: 256
          nullable: true
          description: Stable reusable-blueprint name. Required only for CreateNew.
      oneOf:
        - title: Use an existing typed blueprint
          properties:
            mode:
              type: string
              enum: [UseExisting]
          required: [blueprintObjectId]
        - title: Create a reusable blueprint
          properties:
            mode:
              type: string
              enum: [CreateNew]
          required: [displayName]

    AgentIdentityBlueprintSummary:
      type: object
      required: [blueprintObjectId, blueprintClientId, displayName, isAgent365Compatible]
      properties:
        blueprintObjectId:
          type: string
          format: uuid
          description: |
            Typed blueprint application object ID (`id`); its value may equal
            blueprintClientId.
        blueprintClientId:
          type: string
          format: uuid
          description: |
            Typed blueprint application/client ID (`appId`); its value may equal
            blueprintObjectId.
        displayName:
          type: string
        isAgent365Compatible:
          type: boolean
          description: |
            True only when the blueprint contains every Agent 365 manager application
            required by this Gateway deployment. Registration revalidates this server-side.
        agent365CompatibilityIssue:
          type: string
          nullable: true
          enum:
            - ManagerApplicationsNotConfigured
            - MissingRequiredManagerApplications
          description: |
            Safe reason when isAgent365Compatible is false. No manager application ID
            is exposed by this catalog contract.

    AgentIdentityBlueprintListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentIdentityBlueprintSummary'

    PurviewPolicyProfileSelection:
      type: object
      deprecated: true
      description: |
        Compatibility-only combined profile selection. New clients use
        PurviewDlpProfileSelection after Settings has established a Ready profile.
      required: [mode]
      oneOf:
        - title: Use an existing profile
          required: [mode, profileId]
          properties:
            mode:
              type: string
              enum: [UseExisting]
        - title: Create a profile
          required: [mode, displayName, template]
          properties:
            mode:
              type: string
              enum: [CreateNew]
            template:
              type: string
              enum: [AllSensitiveInformation]
      properties:
        mode:
          type: string
          enum: [UseExisting, CreateNew]
        profileId:
          type: string
          format: uuid
          nullable: true
        displayName:
          type: string
          maxLength: 120
          nullable: true
        template:
          type: string
          enum: [AllSensitiveInformation]
          nullable: true

    PurviewPolicyProfileSummary:
      type: object
      required: [id, displayName, template, mode, status, blueprintCount]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        template:
          type: string
        mode:
          $ref: '#/components/schemas/PurviewMode'
        status:
          type: string
          enum: [Ready]
        blueprintCount:
          type: integer
          minimum: 0
        verifiedAtUtc:
          type: string
          format: date-time
          nullable: true

    PurviewPolicyProfileListResponse:
      type: object
      deprecated: true
      description: Compatibility-only combined profile inventory.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PurviewPolicyProfileSummary'

    ProtectionCapabilityResourceIdentifiers:
