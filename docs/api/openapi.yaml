openapi: 3.0.3
info:
  title: A365 Custom Gateway API
  description: |
    Gateway API designed for this solution, not a Microsoft API.

    Bridges external AI agents to Microsoft Agent 365 without requiring those agents
    to embed the Agent 365 SDK or CLI. Provides both a control plane (registration,
    provisioning, administration) and a registration-bound data plane (activity
    ingestion, AI interaction evaluation, observability export). One Gateway brokers
    N external registrations to N mapped child Agent IDs; reusable blueprints may be
    shared, but credentials and routing remain per registration.

    Registration-bound ingress is rate limited after Gateway-key authorization.
    The SQL Server path uses database-UTC fixed-minute buckets and serializable locks
    across global, registration, and credential scopes. The process-local in-memory
    implementation is for tests only.

    Scoped idempotency canonical-hashes the typed request and takes an exclusive,
    transaction-owned SQL application lock for registration + endpoint + key before
    replay lookup or side effects, holding it through persistence and commit.

    For Entra child Agent Identity telemetry, the Gateway emits the child client ID
    as gen_ai.agent.id and the selected blueprint client ID as
    microsoft.a365.agent.blueprint.id. It omits gen_ai.agent.type and
    microsoft.a365.agent.platform.id. Agent 365 OTLP HTTP 200 proves endpoint
    acceptance only, not downstream CloudAppEvents landing.

    Protection capability rows are materialized only at verified runtime startup
    from bootstrap's complete exact 19-key, ownership/source/time-bound attestation.
    Synchronization is SQL application-locked and transactional. It does not imply
    policy, propagation, token-role, or runtime-verdict readiness.
  version: 0.1.0-beta.2
  contact:
    name: Gateway Admin
  license:
    name: Proprietary

servers:
  - url: https://{host}/api/v1
    description: Gateway API
    variables:
      host:
        default: localhost:7089

security:
  - entraBearer: []

tags:
  - name: Agents
    description: Agent registration and management (control plane)
  - name: Blueprints
    description: Typed reusable Agent ID blueprint inventory (control plane)
  - name: Operations
    description: Async operation status tracking
  - name: Audit
    description: Audit events and provisioning history
  - name: Prompt protection
    description: Registration-bound pre-model Prompt Shields and Purview evaluation
  - name: Protection administration
    description: Role-aware capability, Purview policy, and readiness control plane
  - name: System
    description: System configuration and health
  - name: Activities
    description: Activity ingestion (data plane)
  - name: Interactions
    description: AI interaction submission and evaluation (data plane)
  - name: Agent Runtime
    description: Protected per-registration Gateway credential readiness probe

paths:
  /agents:
    post:
      operationId: registerAgent
      summary: Register a new external agent
      description: |
        Creates a new agent registration and starts async provisioning.
        Returns 202 Accepted with agent and operation URLs.

        This endpoint fails closed before persistence unless the deployment
        explicitly enables the authenticated continuous-development registration
        path. Other deployment profiles keep registration closed. Clients can read
        the effective gate from provisioningExecutionEnabled in GET /system/config.

        Workflow-v3 selects or creates a reusable typed Agent ID
        blueprint. It does not accept an external-runtime managed-identity object ID.
        Ordinary Entra apps cannot be substituted as blueprints.

        The response contains a unique per-registration Gateway API key exactly
        once. Store it immediately in the external agent's secret manager. The
        Gateway persists only a salted hash and cannot retrieve the clear key later.
        If a successful one-time response is lost, do not retry registration to
        recover the secret and do not search idempotency storage. Read safe metadata,
        issue a replacement through the administrator credential endpoint, and
        deploy/verify it before revoking any usable key.

        Internally, Blueprint and Blueprint Principal reads retain their typed
        Microsoft Graph casts. Agent Identity verification uses the typed
        /servicePrincipals/{id}/microsoft.graph.agentIdentity GET with sponsor
        expansion. These are Microsoft implementation dependencies, not Gateway
        API paths.

        Gateway API designed for this solution, not a Microsoft API.
      tags: [Agents]
      security:
        - entraBearer: [Gateway.Administrator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAgentRequest'
            example:
              externalAgentId: crm-assistant-prod
              name: CRM Assistant
              description: Answers customer and sales questions.
              ownerObjectId: 00000000-0000-0000-0000-000000000001
              environment: Production
              features:
                agent365ObservabilityEnabled: true
                azureMonitorExportEnabled: false
                purviewEnabled: true
                purviewMode: Enforce
              blueprint:
                mode: UseExisting
                blueprintObjectId: 11111111-1111-1111-1111-111111111111
      responses:
        '202':
          description: Agent registration accepted, provisioning started
          headers:
            Location:
              schema:
                type: string
              description: URL of the created agent resource
            Cache-Control:
              schema:
                type: string
              description: Always `no-store` because the body contains a one-time key.
            Pragma:
              schema:
                type: string
              description: Always `no-cache` because the body contains a one-time key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterAgentResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Duplicate externalAgentId
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://gateway.example.com/problems/duplicate-external-agent-id
                title: An agent with this externalAgentId already exists.
                status: 409
                errorCode: DUPLICATE_EXTERNAL_AGENT_ID
        '422':
          description: Unsupported feature configuration or incompatible existing blueprint
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          $ref: '#/components/responses/ProvisioningDisabled'

    get:
      operationId: listAgents
      summary: List agents with filtering and pagination
      tags: [Agents]
      security:
        - entraBearer: [Gateway.Administrator, Gateway.Operator, Gateway.Auditor, Gateway.SupportReader]
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AgentStatus'
        - name: environment
          in: query
          schema:
            $ref: '#/components/schemas/Environment'
        - name: search
          in: query
          description: Search in name, externalAgentId, description
          schema:
            type: string
            maxLength: 256
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated list of agents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /agent-identity-blueprints:
    get:
      operationId: listAgentIdentityBlueprints
      summary: List reusable typed Agent ID blueprints
      description: |
        Gateway-owned control-plane catalog used by the registration dropdown.
        Reads the typed Microsoft Graph blueprint collection with validated paging
        and fails closed on dependency or identity errors. Every typed blueprint is
        returned with Agent 365 compatibility metadata derived from the deployment's
        configured manager applications. Incompatible entries remain inventory-visible
        but cannot be registered. It never converts an ordinary application into a
        blueprint and never returns partial inventory as a successful empty result.
      tags: [Blueprints]
      security:
        - entraBearer: [Gateway.Administrator]
      responses:
        '200':
          description: Typed reusable blueprint inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentIdentityBlueprintListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /purview-policy-profiles:
    get:
      operationId: listPurviewPolicyProfiles
      deprecated: true
      summary: List legacy verified combined Purview profiles
      description: |
        Compatibility-only inventory for older clients. New clients use
        /protection/purview/dlp-profiles and the independent Know Your Data route.
        Registration never authors policy as a side effect.
      tags: [Configuration]
      security:
        - entraBearer: [Gateway.Administrator]
      responses:
        '200':
          description: Verified reusable Purview profile inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurviewPolicyProfileListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /protection/capabilities:
    get:
      operationId: getProtectionCapabilities
      summary: Read installed protection capability facts
      description: |
        Returns bootstrap-owned capability records. Installed means exact capability
        configuration readback; it does not prove policy, propagation, token roles,
        or runtime verdict readiness.
      tags: [Protection administration]
      security:
        - entraBearer: [Gateway.Administrator, Gateway.Operator, Gateway.Auditor, Gateway.SupportReader]
      responses:
        '200':
          description: Bounded non-secret capability facts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtectionCapabilitiesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /protection/purview/connection:
    get:
      operationId: getPurviewTenantConnection
      summary: Read the current tenant Purview connection
      tags: [Protection administration]
      security:
        - entraBearer: [Gateway.Administrator, Gateway.Operator]
      responses:
        '200':
          description: Current tenant connection or null
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurviewTenantConnectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /protection/purview/connection-operations:review:
    post:
      operationId: reviewPurviewTenantConnection
      summary: Review an exact-tenant connection operation
      description: Returns a short-lived one-time review value and performs no provider mutation.
      tags: [Protection administration]
      security:
        - entraBearer: [Gateway.Administrator]
      parameters:
        - $ref: '#/components/parameters/ProtectionIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewPurviewTenantConnectionRequest'
      responses:
        '200':
          $ref: '#/components/responses/ProtectionOperationReviewed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ConcurrencyConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /protection/operation-reviews:confirm:
    post:
      operationId: confirmProtectionOperationReview
      summary: Explicitly confirm one protection-operation review
      description: |
        Exchanges one fresh review value once for a short-lived confirmation value.
        Neither value is a provider token or credential.
      tags: [Protection administration]
      security:
        - entraBearer: [Gateway.Administrator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmProtectionOperationReviewRequest'
      responses:
        '200':
          description: One-time confirmation issued
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `no-store`.
            Pragma:
              schema:
                type: string
              description: Always `no-cache`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtectionOperationConfirmationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ConcurrencyConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /protection/purview/connection-operations:
    post:
      operationId: startPurviewTenantConnection
      summary: Start a confirmed Purview tenant-connection operation
      tags: [Protection administration]
      security:
        - entraBearer: [Gateway.Administrator]
      parameters:
        - $ref: '#/components/parameters/ProtectionIdempotencyKey'
        - $ref: '#/components/parameters/ProtectionIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartPurviewTenantConnectionOperationRequest'
      responses:
        '202':
          $ref: '#/components/responses/ProtectionOperationAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ConcurrencyConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /protection/purview/connection-operations/{operationId}:review-completion:
    parameters:
      - $ref: '#/components/parameters/ProtectionOperationId'
    post:
      operationId: reviewPurviewTenantConnectionCompletion
      summary: Review bounded Windows companion evidence
      description: Performs no provider mutation and grants no completion by itself.
      tags: [Protection administration]
      security:
        - entraBearer: [Gateway.Administrator]
      parameters:
        - $ref: '#/components/parameters/ProtectionIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewPurviewTenantConnectionCompletionRequest'
      responses:
        '200':
          $ref: '#/components/responses/ProtectionOperationReviewed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ConcurrencyConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /protection/purview/connection-operations/{operationId}:complete:
    parameters:
      - $ref: '#/components/parameters/ProtectionOperationId'
    post:
      operationId: completePurviewTenantConnection
      summary: Submit confirmed companion evidence for independent verification
      tags: [Protection administration]
      security:
        - entraBearer: [Gateway.Administrator]
      parameters:
        - $ref: '#/components/parameters/ProtectionIdempotencyKey'
        - $ref: '#/components/parameters/ProtectionIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletePurviewTenantConnectionOperationRequest'
      responses:
        '202':
          $ref: '#/components/responses/ProtectionOperationAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ConcurrencyConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /protection/purview/sensitive-information-types:
    get:
      operationId: getPurviewSensitiveInformationTypes
      summary: Read the current connected-tenant SIT inventory
      tags: [Protection administration]
      security:
        - entraBearer: [Gateway.Administrator]
      responses:
        '200':
          description: Expiring bounded tenant inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurviewSensitiveInformationTypeListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /protection/purview/know-your-data:
    get:
      operationId: getPurviewKnowYourData
      summary: Read independent tenant-wide Know Your Data state
      tags: [Protection administration]
      security:
        - entraBearer: [Gateway.Administrator, Gateway.Operator]
      responses:
        '200':
          description: Fixed-Group configuration or null
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurviewKnowYourDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /protection/purview/know-your-data-operations:review:
    post:
      operationId: reviewPurviewKnowYourData
      summary: Review a fixed-Group Know Your Data operation
      tags: [Protection administration]
      security:
        - entraBearer: [Gateway.Administrator]
      parameters:
        - $ref: '#/components/parameters/ProtectionIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewPurviewKnowYourDataOperationRequest'
      responses:
        '200':
          $ref: '#/components/responses/ProtectionOperationReviewed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ConcurrencyConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /protection/purview/know-your-data-operations:
    post:
      operationId: startPurviewKnowYourData
      summary: Start a confirmed fixed-Group Know Your Data operation
      tags: [Protection administration]
      security:
        - entraBearer: [Gateway.Administrator]
      parameters:
        - $ref: '#/components/parameters/ProtectionIdempotencyKey'
        - $ref: '#/components/parameters/ProtectionIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmProtectionAdminOperationRequest'
      responses:
        '202':
          $ref: '#/components/responses/ProtectionOperationAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ConcurrencyConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /protection/purview/dlp-profiles:
    get:
      operationId: listPurviewDlpProfiles
      summary: List current-tenant blueprint DLP profiles and readiness
      tags: [Protection administration]
      security:
        - entraBearer: [Gateway.Administrator, Gateway.Operator]
      responses:
        '200':
          description: Authorized profiles, including non-Ready states
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurviewDlpProfileListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /protection/purview/dlp-profile-operations:review:
    post:
      operationId: reviewPurviewDlpProfile
      summary: Review one blueprint-Individual DLP operation
      tags: [Protection administration]
      security:
        - entraBearer: [Gateway.Administrator]
      parameters:
        - $ref: '#/components/parameters/ProtectionIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewPurviewDlpProfileOperationRequest'
      responses:
        '200':
          $ref: '#/components/responses/ProtectionOperationReviewed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ConcurrencyConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /protection/purview/dlp-profile-operations:
    post:
      operationId: startPurviewDlpProfile
      summary: Start a confirmed blueprint-Individual DLP operation
      tags: [Protection administration]
      security:
        - entraBearer: [Gateway.Administrator]
      parameters:
        - $ref: '#/components/parameters/ProtectionIdempotencyKey'
        - $ref: '#/components/parameters/ProtectionIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmProtectionAdminOperationRequest'
      responses:
        '202':
          $ref: '#/components/responses/ProtectionOperationAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ConcurrencyConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /protection/purview/dlp-profiles/{profileId}:review-reconcile:
    parameters:
      - $ref: '#/components/parameters/PurviewDlpProfileId'
    post:
      operationId: reviewReconcilePurviewDlpProfile
      summary: Review exact DLP profile reconciliation
      tags: [Protection administration]
      security:
        - entraBearer: [Gateway.Administrator]
      parameters:
        - $ref: '#/components/parameters/ProtectionIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewReconcilePurviewDlpProfileRequest'
      responses:
        '200':
          $ref: '#/components/responses/ProtectionOperationReviewed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ConcurrencyConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /protection/purview/dlp-profiles/{profileId}:reconcile:
    parameters:
      - $ref: '#/components/parameters/PurviewDlpProfileId'
    post:
      operationId: reconcilePurviewDlpProfile
      summary: Re-read exact DLP profile provider state
      description: Does not silently rewrite mismatched provider policy.
      tags: [Protection administration]
      security:
        - entraBearer: [Gateway.Administrator]
      parameters:
        - $ref: '#/components/parameters/ProtectionIdempotencyKey'
        - $ref: '#/components/parameters/ProtectionIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmProtectionAdminOperationRequest'
      responses:
        '202':
          $ref: '#/components/responses/ProtectionOperationAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ConcurrencyConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /protection/purview/dlp-profiles/{profileId}:review-runtime-validation:
    parameters:
      - $ref: '#/components/parameters/PurviewDlpProfileId'
    post:
      operationId: reviewValidatePurviewDlpProfileRuntime
      summary: Review a bounded synthetic runtime readiness check
      tags: [Protection administration]
      security:
        - entraBearer: [Gateway.Administrator]
      parameters:
        - $ref: '#/components/parameters/ProtectionIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewValidatePurviewDlpRuntimeRequest'
      responses:
        '200':
          $ref: '#/components/responses/ProtectionOperationReviewed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ConcurrencyConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /protection/purview/dlp-profiles/{profileId}:validate-runtime:
    parameters:
      - $ref: '#/components/parameters/PurviewDlpProfileId'
    post:
      operationId: validatePurviewDlpProfileRuntime
      summary: Start a confirmed bounded runtime readiness check
      tags: [Protection administration]
      security:
        - entraBearer: [Gateway.Administrator]
      parameters:
        - $ref: '#/components/parameters/ProtectionIdempotencyKey'
        - $ref: '#/components/parameters/ProtectionIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmProtectionAdminOperationRequest'
      responses:
        '202':
          $ref: '#/components/responses/ProtectionOperationAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ConcurrencyConflict'
        '429':
