          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/BatchActivityResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/BatchActivityResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/BatchActivityResponse'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '413':
          description: Payload Too Large
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: 'Missing, invalid or expired credential. Use the authentication scheme documented for this operation.'
        '429':
          description: Gateway rate limit exceeded. Respect Retry-After when supplied.
      security:
        - AgentKey: [ ]
  /api/v1/agent-identity-blueprints:
    get:
      tags:
        - AgentIdentityBlueprints
      summary: List available identity blueprints
      description: "Lists blueprints eligible for registration. Each registration receives an individual agent identity; policies are assigned to that identity, not the shared blueprint.\n\nAuthorization policy: AdministratorOnly."
      operationId: AgentIdentityBlueprints.ListAgentIdentityBlueprints
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AgentIdentityBlueprintListResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AgentIdentityBlueprintListResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AgentIdentityBlueprintListResponse'
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: Bad Gateway
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Service Unavailable
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Gateway rate limit exceeded. Respect Retry-After when supplied.
      security:
        - EntraBearer: [ ]
  '/api/v1/agents/{agentId}/purview-policies':
    get:
      tags:
        - AgentPolicyAssignments
      summary: Read individual-agent policy assignments
      description: "Reports assignment states, binding freshness and observed allow/block timestamps. Assigned, synchronized and verified enforcement are distinct. A block does not identify which applicable policy caused it.\n\nAuthorization policy: AdministratorOnly."
      operationId: AgentPolicyAssignments.List
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AgentPolicyAssignmentsResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPolicyAssignmentsResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AgentPolicyAssignmentsResponse'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: 'Missing, invalid or expired credential. Use the authentication scheme documented for this operation.'
        '403':
          description: 'Authenticated caller is not permitted, or protection blocked the request. Inspect the response errorCode and correlationId.'
        '429':
          description: Gateway rate limit exceeded. Respect Retry-After when supplied.
      security:
        - EntraBearer: [ ]
  '/api/v1/agents/{agentId}/purview-policies/review':
    post:
      tags:
        - AgentPolicyAssignments
      summary: Review an individual-agent assignment
      description: "Binds a compatible policy revision, administrator and exact agent identity to a short-lived review. No policy write occurs until confirmation. Use policyId and revision from the current catalog.\n\nAuthorization policy: AdministratorOnly."
      operationId: AgentPolicyAssignments.Review
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Selection'
          text/json:
            schema:
              $ref: '#/components/schemas/Selection'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Selection'
        required: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PolicyAssignmentReviewResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyAssignmentReviewResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/PolicyAssignmentReviewResponse'
        '404':
          description: Not Found
          content:
