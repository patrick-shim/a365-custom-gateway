        '403':
          description: 'Authenticated caller is not permitted, or protection blocked the request. Inspect the response errorCode and correlationId.'
        '429':
          description: Gateway rate limit exceeded. Respect Retry-After when supplied.
      security:
        - EntraBearer: [ ]
  '/api/v1/agents/{agentId}/credentials':
    get:
      tags:
        - Agents
      summary: List agent credential metadata
      description: "Returns metadata only. Existing secret values cannot be retrieved.\n\nAuthorization policy: AdministratorOnly."
      operationId: Agents.ListAgentIngressCredentials
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AgentIngressCredentialListResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AgentIngressCredentialListResponse'
            text/json:
