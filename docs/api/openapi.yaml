openapi: '3.1.1'
info:
  title: A365 Gateway API
  description: 'Connect independently hosted agents to Microsoft Entra, Agent 365, Purview and Prompt Shields. Administration uses an Entra access token; agent ingress uses a gateway-issued secret. Both use Authorization: Bearer, but are not interchangeable. Evaluate → call your model only on allow → submit the interaction. HTTP 202 means queued, never confirmed delivery. All timestamps are UTC. Interactive requests act on the live deployment.'
  version: v1
servers:
  - url: http://127.0.0.1:5080/
paths:
  /api/v1/agent-activities:
    post:
      tags:
        - Activities
      summary: Submit an agent activity
      description: "Queues sanitized activity telemetry. HTTP 202 means accepted, not delivered to Agent 365. Use a stable ActivityId and a UUID v4 Idempotency-Key for retries.\n\nAuthorization policy: ExternalAgentOnly."
      operationId: Activities.SubmitActivity
      parameters:
        - name: Idempotency-Key
          in: header
          description: Canonical UUID v4. Reuse only for a retry of this exact request; use a new value for a new action.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitActivityRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/SubmitActivityRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SubmitActivityRequest'
        required: true
      responses:
        '202':
          description: Accepted
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ActivityReceiptDto'
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityReceiptDto'
            text/json:
              schema:
                $ref: '#/components/schemas/ActivityReceiptDto'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '413':
          description: Payload Too Large
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: 'Missing, invalid or expired credential. Use the authentication scheme documented for this operation.'
        '429':
          description: Gateway rate limit exceeded. Respect Retry-After when supplied.
      security:
        - AgentKey: [ ]
  /api/v1/agent-activities:batch:
    post:
      tags:
        - Activities
      summary: Submit an activity batch
      description: "Queues a bounded batch of activities for the authenticated agent. Use a UUID v4 Idempotency-Key. Inspect the response for per-item acceptance.\n\nAuthorization policy: ExternalAgentOnly."
      operationId: Activities.SubmitBatchActivities
      parameters:
        - name: Idempotency-Key
          in: header
          description: Canonical UUID v4. Reuse only for a retry of this exact request; use a new value for a new action.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
