    SystemConfig:
      type: object
      description: |
        Current singleton system configuration and deployment capabilities in the
        flat API DTO shape. Deprecated read-only compatibility values remain in the
        response for existing clients but do not advertise active runtime controls.
      required:
        - provisioningMode
        - defaultObservabilityMode
        - defaultPurviewEnabled
        - defaultPromptShieldEnabled
        - retentionDaysActivityReceipts
        - retentionDaysAuditEvents
        - retentionDaysIdempotencyRecords
        - retentionDaysOutboxMessages
        - rateLimitPerClient
        - rateLimitPerAgent
        - rateLimitGlobal
        - reconciliationEnabled
        - reconciliationIntervalHours
        - stuckTransitionTimeoutDays
        - useGraphAgentRegistration
        - useCliProvisioningFallback
        - provisioningExecutionEnabled
        - purviewPolicyProvisioningEnabled
        - promptShieldAvailable
      properties:
        provisioningMode:
          type: string
          enum: [Automatic, Manual]
          deprecated: true
          readOnly: true
          description: Persisted compatibility value; provisioning execution is deployment-controlled.
        defaultObservabilityMode:
          deprecated: true
          description: Deprecated compatibility encoding of the two canonical defaults.
          allOf:
            - $ref: '#/components/schemas/ObservabilityMode'
        defaultAgent365ObservabilityEnabled:
          type: boolean
          nullable: true
          default: true
          description: Default Agent 365 export setting for new agent registrations.
        defaultAzureMonitorExportEnabled:
          type: boolean
          nullable: true
          default: false
          description: Default optional Azure Monitor mirror setting for new agent registrations.
        defaultPurviewEnabled:
          type: boolean
        defaultPurviewMode:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PurviewMode'
        defaultPromptShieldEnabled:
          type: boolean
          description: Default Prompt Shields setting for new registrations.
        retentionDaysActivityReceipts:
          type: integer
          deprecated: true
          readOnly: true
          description: Persisted compatibility value; no activity-receipt cleanup worker consumes it.
        retentionDaysAuditEvents:
          type: integer
          deprecated: true
          readOnly: true
          description: Persisted compatibility value; no audit-event cleanup worker consumes it.
        retentionDaysIdempotencyRecords:
          type: integer
          minimum: 1
          maximum: 3650
          description: Lifetime, in days, captured when the Gateway creates an idempotency record.
        retentionDaysOutboxMessages:
          type: integer
          deprecated: true
          readOnly: true
          description: Persisted compatibility value; no outbox cleanup worker consumes it.
        rateLimitPerClient:
          type: integer
          minimum: 1
          maximum: 10000000
          description: Maximum requests per Gateway credential in each database-UTC fixed minute.
        rateLimitPerAgent:
          type: integer
          minimum: 1
          maximum: 10000000
          description: Maximum requests per authenticated registration in each database-UTC fixed minute.
        rateLimitGlobal:
          type: integer
          minimum: 1
          maximum: 10000000
          description: Maximum registration-bound requests Gateway-wide in each database-UTC fixed minute.
        reconciliationEnabled:
          type: boolean
          deprecated: true
          readOnly: true
          description: Persisted compatibility value; the current Gateway has no verified reconciliation scheduler or Microsoft adapter.
        reconciliationIntervalHours:
          type: integer
          deprecated: true
          readOnly: true
          description: Persisted compatibility value with no current background execution effect.
        stuckTransitionTimeoutDays:
          type: integer
          deprecated: true
          readOnly: true
          description: Persisted compatibility value; no stuck-transition cleanup service consumes it.
        useGraphAgentRegistration:
          type: boolean
          deprecated: true
          readOnly: true
          description: Persisted compatibility field; it does not select the current deployment provider or enable provisioning execution.
        useCliProvisioningFallback:
          type: boolean
          deprecated: true
          readOnly: true
          description: Persisted compatibility field; the current worker has no unattended CLI fallback.
        provisioningExecutionEnabled:
          type: boolean
          readOnly: true
          description: |
            Effective deployment capability gate for new registration and
            provisioning retry. True requires the explicitly enabled authenticated
            continuous-development path. False means those requests return
            PROVISIONING_DISABLED before creating an agent, job, or outbox message.
            This value is supplied by deployment configuration and cannot be changed
            through PATCH.
        purviewPolicyProvisioningEnabled:
          type: boolean
          readOnly: true
          description: |
            True only when the Gateway worker has the reviewed app-only Security &
            Compliance PowerShell configuration needed to create or extend a
            protection profile for a new blueprint.
        promptShieldAvailable:
          type: boolean
          readOnly: true
          description: True when this deployment has a configured Prompt Shields provider.
        rowVersion:
          type: string
          nullable: true
          description: Opaque concurrency value returned as ETag.

    UpdateSystemConfigRequest:
      type: object
      description: |
        Partial update of implemented registration defaults, idempotency-record
        lifetime, and ingress rate limits. The canonical observability defaults can
        be changed independently. If deprecated defaultObservabilityMode is also
        supplied, all supplied destination values must agree. Compatibility-only
        properties remain for wire compatibility; omit them or send null because
        every non-null value is rejected with a validation error.
      properties:
        provisioningMode:
          type: string
          enum: [Automatic, Manual]
          nullable: true
          deprecated: true
          description: Compatibility-only property. Omit or send null; every non-null write is rejected.
        defaultObservabilityMode:
          deprecated: true
          description: Deprecated compatibility encoding of the two canonical defaults.
          allOf:
            - $ref: '#/components/schemas/ObservabilityMode'
        defaultAgent365ObservabilityEnabled:
          type: boolean
          description: Default Agent 365 export setting for new agent registrations.
        defaultAzureMonitorExportEnabled:
          type: boolean
          description: Default optional Azure Monitor mirror setting for new agent registrations.
        defaultPurviewEnabled:
          type: boolean
        defaultPurviewMode:
          $ref: '#/components/schemas/PurviewMode'
        defaultPromptShieldEnabled:
          type: boolean
        idempotencyKey:
          type: string
          format: uuid
          nullable: true
          description: Required for a protection-default mutation and must match Idempotency-Key.
        expectedRowVersion:
          type: string
          nullable: true
          description: Required for a protection-default mutation and must match If-Match.
        retentionDaysActivityReceipts:
          type: integer
          nullable: true
          deprecated: true
          description: Compatibility-only property. Omit or send null; activity-receipt cleanup is not implemented.
        retentionDaysAuditEvents:
          type: integer
          nullable: true
          deprecated: true
          description: Compatibility-only property. Omit or send null; audit-event cleanup is not implemented.
        retentionDaysIdempotencyRecords:
          type: integer
          minimum: 1
          maximum: 3650
        retentionDaysOutboxMessages:
          type: integer
          nullable: true
          deprecated: true
          description: Compatibility-only property. Omit or send null; outbox cleanup is not implemented.
        rateLimitPerClient:
          type: integer
          minimum: 1
          maximum: 10000000
          description: Maximum requests per Gateway credential in each database-UTC fixed minute.
        rateLimitPerAgent:
          type: integer
          minimum: 1
          maximum: 10000000
          description: Maximum requests per authenticated registration in each database-UTC fixed minute.
        rateLimitGlobal:
          type: integer
          minimum: 1
          maximum: 10000000
          description: Maximum registration-bound requests Gateway-wide in each database-UTC fixed minute; must be at least as large as each scoped limit after merging the partial update.
        reconciliationEnabled:
          type: boolean
          nullable: true
          deprecated: true
          description: Compatibility-only property. Omit or send null; every non-null write is rejected because reconciliation is not implemented.
        reconciliationIntervalHours:
          type: integer
          nullable: true
          deprecated: true
          description: Compatibility-only property. Omit or send null; every non-null write is rejected because reconciliation is not implemented.
        stuckTransitionTimeoutDays:
          type: integer
          nullable: true
          deprecated: true
          description: Compatibility-only property. Omit or send null; no stuck-transition cleanup service consumes it.
        useGraphAgentRegistration:
          type: boolean
          nullable: true
          deprecated: true
          description: Compatibility-only property. Omit or send null; provider selection is deployment-controlled.
        useCliProvisioningFallback:
          type: boolean
          nullable: true
          deprecated: true
          description: Compatibility-only property. Omit or send null; the Gateway has no unattended CLI fallback.

    SubmitActivityRequest:
      type: object
      required: [externalAgentId, activityId, activityType, occurredAtUtc, actor]
      properties:
        externalAgentId:
          type: string
        activityId:
          type: string
          minLength: 1
          maxLength: 256
        sessionId:
          type: string
          maxLength: 256
        activityType:
          $ref: '#/components/schemas/ActivityType'
        occurredAtUtc:
          type: string
          format: date-time
        actor:
          type: object
          description: |
            When Agent 365 observability is enabled, type must be User and a valid
            tenantUserObjectId is required. Agent and System remain available for
            Disabled and GatewayOnly destination modes.
          required: [type]
          properties:
            type:
              $ref: '#/components/schemas/ActorType'
            tenantUserObjectId:
              type: string
              format: uuid
              description: |
                Microsoft Entra tenant user object ID attributed to the activity.
                Required with actor.type User when Agent 365 observability is
                enabled; otherwise optional.
        tool:
          type: object
          required: [name, outcome]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 256
            operation:
              type: string
              maxLength: 256
            outcome:
              $ref: '#/components/schemas/ToolOutcome'
            durationMs:
              type: integer
              minimum: 0
        attributes:
          type: object
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 256

    ActivityReceipt:
      type: object
      required: [receiptId, activityId, status, receivedAtUtc]
      properties:
        receiptId:
          type: string
          format: uuid
        activityId:
          type: string
        status:
          type: string
          enum: [Accepted]
        receivedAtUtc:
          type: string
          format: date-time
        correlationId:
          type: string
          format: uuid

    BatchActivityRequest:
      type: object
      required: [externalAgentId, activities]
      properties:
        externalAgentId:
          type: string
        activities:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [activityId, activityType, occurredAtUtc, actor]
            properties:
              activityId:
                type: string
                minLength: 1
                maxLength: 256
              sessionId:
                type: string
                maxLength: 256
              activityType:
                $ref: '#/components/schemas/ActivityType'
              occurredAtUtc:
                type: string
                format: date-time
              actor:
                type: object
                description: |
                  When Agent 365 observability is enabled, type must be User and a
                  valid tenantUserObjectId is required. Agent and System remain
                  available for Disabled and GatewayOnly destination modes.
                required: [type]
                properties:
                  type:
                    $ref: '#/components/schemas/ActorType'
                  tenantUserObjectId:
                    type: string
                    format: uuid
                    description: |
                      Microsoft Entra tenant user object ID attributed to this
                      activity. Required with actor.type User when Agent 365
                      observability is enabled; otherwise optional.
              tool:
                type: object
                required: [name, outcome]
                properties:
                  name:
                    type: string
                  operation:
                    type: string
                  outcome:
                    $ref: '#/components/schemas/ToolOutcome'
                  durationMs:
                    type: integer
                    minimum: 0
              attributes:
                type: object
                maxProperties: 20
                additionalProperties:
                  type: string
                  maxLength: 256

    BatchActivityResponse:
      type: object
      required: [accepted, rejected, items]
      properties:
        accepted:
          type: integer
        rejected:
          type: integer
        items:
          type: array
          items:
            type: object
            required: [activityId, status]
            properties:
              activityId:
                type: string
              status:
                type: string
                enum: [Accepted, Rejected]
              receiptId:
                type: string
                format: uuid
              code:
                type: string
              detail:
                type: string
        correlationId:
          type: string
          format: uuid

    EvaluatePromptRequest:
      type: object
      required: [externalAgentId, interactionId, occurredAtUtc, prompt]
      properties:
        externalAgentId:
          type: string
        interactionId:
          type: string
          minLength: 1
          maxLength: 256
        occurredAtUtc:
          type: string
          format: date-time
        userContext:
          type: object
          properties:
            tenantUserObjectId:
              type: string
              format: uuid
        prompt:
          type: object
          required: [contentType, content]
          properties:
            contentType:
              type: string
              enum: [text/plain, text/markdown]
            content:
              type: string
              maxLength: 10000

    PromptEvaluationResult:
      type: object
      required: [evaluationId, interactionId, allowed, decision, promptShieldProcessing, purviewProcessing, userMessage, correlationId]
      properties:
        evaluationId:
          type: string
          format: uuid
        evaluationReceiptId:
          type: string
          format: uuid
          nullable: true
          description: Present only when allowed; short-lived and single use.
        interactionId:
          type: string
        allowed:
          type: boolean
        decision:
          type: string
          enum: [PROMPT_ALLOWED, PROMPT_BLOCKED_BY_PROMPT_SHIELD, PROMPT_BLOCKED_BY_DLP, PROMPT_BLOCKED_BY_MULTIPLE_CONTROLS]
        promptShieldProcessing:
          type: string
          enum: [Disabled, Allowed, Blocked]
        purviewProcessing:
          type: string
          enum: [Allowed, Blocked, AuditLogged, PurviewDisabled]
        expiresAtUtc:
          type: string
          format: date-time
          nullable: true
        userMessage:
          type: string
        correlationId:
          type: string
          format: uuid

    SubmitInteractionRequest:
      type: object
      required: [externalAgentId, interactionId, occurredAtUtc, prompt, response]
      properties:
        externalAgentId:
          type: string
        interactionId:
          type: string
          minLength: 1
          maxLength: 256
        sessionId:
          type: string
          maxLength: 256
        occurredAtUtc:
          type: string
          format: date-time
        userContext:
          type: object
          description: |
            End-user context for Purview and Agent 365 attribution. It is optional
            only when the requested processing does not require Purview and Agent
            365 observability is disabled for the registered agent.
          properties:
            tenantUserObjectId:
              type: string
              format: uuid
              description: |
                Non-empty Microsoft Entra tenant user object ID. Required whenever
                Agent 365 observability is enabled and for Purview evaluation.
        prompt:
          type: object
          required: [contentType, content]
          properties:
            contentType:
              type: string
              enum: [text/plain, text/markdown]
            content:
              type: string
              maxLength: 32768
        response:
          type: object
          required: [contentType, content]
          properties:
            contentType:
              type: string
              enum: [text/plain, text/markdown]
            content:
              type: string
              maxLength: 32768
        model:
          type: object
          properties:
            provider:
              type: string
              maxLength: 256
            name:
              type: string
              maxLength: 256
        metadata:
          type: object
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 256
        promptEvaluationReceiptId:
          type: string
          format: uuid
          nullable: true
          description: |
            Required when Prompt Shields or Purview is enabled. Must be the unexpired,
            single-use receipt returned for the exact prompt by /prompts:evaluate.

    InteractionReceipt:
      type: object
      required: [receiptId, interactionId, status]
      properties:
        receiptId:
          type: string
          format: uuid
        interactionId:
          type: string
        status:
          type: string
          enum: [Accepted, Failed]
        purviewProcessing:
          type: string
          enum: [Allowed, Blocked, AuditLogged, PurviewDisabled]
        observabilityProcessing:
          type: string
          enum: [Pending, Queued]
        correlationId:
          type: string
          format: uuid

    ReadinessResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [Ready, Unavailable]

    ProblemDetails:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        errorCode:
          type: string
        detail:
          type: string
        instance:
          type: string
        correlationId:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    Links:
      type: object
      additionalProperties:
        type: string

  responses:
    ProtectionOperationReviewed:
      description: Review created; no provider mutation has been authorized or performed
      headers:
        Cache-Control:
          schema:
            type: string
          description: Always `no-store`.
        Pragma:
          schema:
            type: string
          description: Always `no-cache`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProtectionOperationReviewResponse'

    ProtectionOperationAccepted:
      description: Confirmed protection administration operation accepted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProtectionOperationAcceptedResponse'

    TooManyRequests:
      description: Protection-administration per-user or per-IP limit reached
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    ValidationError:
      description: Validation error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://gateway.example.com/problems/validation-failed
            title: One or more validation errors occurred.
            status: 400
            errorCode: VALIDATION_FAILED
            errors:
              ExternalAgentId:
                - ExternalAgentId is required.

    Unauthorized:
      description: Authentication required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://gateway.example.com/problems/authentication-required
            title: Authentication is required.
            status: 401
            errorCode: AUTHENTICATION_REQUIRED

    Forbidden:
      description: Insufficient permissions; the authorization middleware returns HTTP 403 without a Gateway Problem Details body

    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://gateway.example.com/problems/agent-not-found
            title: The specified agent was not found.
            status: 404
            errorCode: AGENT_NOT_FOUND

    ConcurrencyConflict:
      description: A concurrent update prevented the operation from being committed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://gateway.example.com/problems/concurrency-conflict
            title: The resource was updated concurrently.
            status: 409
            errorCode: CONCURRENCY_CONFLICT

    BadGateway:
      description: A required upstream dependency rejected or returned an invalid response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    ServiceUnavailable:
      description: A required upstream dependency or credential is unavailable
      content:
        application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    RateLimited:
      description: A credential, registration, or Gateway-wide fixed-minute ingress limit was reached
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Seconds until the current database-UTC minute window resets.
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Limit for the effective/rejected scope.
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Remaining requests in the effective scope; zero on rejection.
        X-RateLimit-Reset:
          schema:
            type: integer
            format: int64
          description: Unix timestamp for the fixed-minute reset.
        X-RateLimit-Scope:
          schema:
            type: string
            enum: [credential, registration, global]
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://gateway.example.com/problems/rate-limit-exceeded
            title: Rate limit exceeded.
            status: 429
            errorCode: RATE_LIMIT_EXCEEDED
            detail: The Gateway request limit was reached. Retry after the current window resets.
            correlationId: 3f2504e0-4f89-41d3-9a0c-0305e82c3301

    ProvisioningDisabled:
      description: Provisioning execution is closed for this deployment
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://gateway.example.com/problems/provisioning-disabled
            title: Provisioning is unavailable.
            status: 503
            errorCode: PROVISIONING_DISABLED
            detail: Complete deployment preflight and explicitly enable the supported development registration path before registering or retrying an agent.
