            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: 'Missing, invalid or expired credential. Use the authentication scheme documented for this operation.'
        '403':
          description: 'Authenticated caller is not permitted, or protection blocked the request. Inspect the response errorCode and correlationId.'
        '429':
          description: Gateway rate limit exceeded. Respect Retry-After when supplied.
      security:
        - EntraBearer: [ ]
    delete:
      tags:
        - Agents
      summary: Delete a gateway registration
      description: "Deletes the gateway registration according to lifecycle rules. Linked Microsoft identities and Registry resources are not automatically deleted.\n\nAuthorization policy: AdministratorOnly."
      operationId: Agents.DeleteAgent
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Accepted
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DeleteAgentResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAgentResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DeleteAgentResponse'
        '404':
