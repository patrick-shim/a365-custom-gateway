              type: string
              enum: [Healthy, Unhealthy]

    ProblemDetails:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
        validationErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              detail:
                type: string
        policyActions:
          type: array
          items:
            type: object
            properties:
              action:
                type: string

    Links:
      type: object
      additionalProperties:
        type: string

  responses:
    ValidationError:
      description: Validation error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://gateway.example.com/problems/validation-failed
            title: One or more validation errors occurred.
            status: 400
            code: VALIDATION_FAILED
            validationErrors:
              - field: externalAgentId
                code: REQUIRED
                detail: externalAgentId is required.

    Unauthorized:
      description: Authentication required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://gateway.example.com/problems/authentication-required
            title: Authentication is required.
            status: 401
            code: AUTHENTICATION_REQUIRED

    Forbidden:
      description: Insufficient permissions
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://gateway.example.com/problems/caller-not-authorized
            title: The caller does not have the required permissions.
            status: 403
            code: CALLER_NOT_AUTHORIZED

    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://gateway.example.com/problems/agent-not-found
            title: The specified agent was not found.
            status: 404
            code: AGENT_NOT_FOUND

    ConcurrencyConflict:
      description: Concurrency conflict (stale ETag)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://gateway.example.com/problems/concurrency-conflict
            title: The resource has been modified since it was last read.
            status: 409
            code: CONCURRENCY_CONFLICT

    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://gateway.example.com/problems/rate-limit-exceeded
            title: Rate limit exceeded.
            status: 429
            code: RATE_LIMIT_EXCEEDED
