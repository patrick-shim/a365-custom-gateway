        '429':
          description: Gateway rate limit exceeded. Respect Retry-After when supplied.
      security:
        - EntraBearer: [ ]
  '/api/v1/agents/{agentId}':
    get:
      tags:
        - Agents
      summary: Read an agent
      description: "Returns registration state, protection configuration, provisioning references and rowVersion. Active registration does not itself establish protection readiness.\n\nAuthorization policy: AllControlPlane."
      operationId: Agents.GetAgent
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AgentDetailDto'
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDetailDto'
            text/json:
              schema:
                $ref: '#/components/schemas/AgentDetailDto'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
