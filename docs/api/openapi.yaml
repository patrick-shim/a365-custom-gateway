        '503':
          description: Service Unavailable
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: 'Missing, invalid or expired credential. Use the authentication scheme documented for this operation.'
        '403':
          description: 'Authenticated caller is not permitted, or protection blocked the request. Inspect the response errorCode and correlationId.'
        '429':
          description: Gateway rate limit exceeded. Respect Retry-After when supplied.
      security:
        - EntraBearer: [ ]
  '/api/v1/agents/{agentId}/purview-policies/{operationId}/confirm':
    post:
      tags:
        - AgentPolicyAssignments
      summary: Confirm a reviewed policy assignment
      description: "Queues the reviewed assignment for this individual identity. Preserves unrelated targets, exclusions, rules and mode. Returns 202 for new work or 200 for an already confirmed operation. Poll assignments for confirmation; requests fail closed while required protection is unavailable.\n\nAuthorization policy: AdministratorOnly."
      operationId: AgentPolicyAssignments.Confirm
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: operationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PolicyAssignmentConfirmationResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyAssignmentConfirmationResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/PolicyAssignmentConfirmationResponse'
        '202':
          description: Accepted
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PolicyAssignmentConfirmationResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyAssignmentConfirmationResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/PolicyAssignmentConfirmationResponse'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: 'Missing, invalid or expired credential. Use the authentication scheme documented for this operation.'
        '403':
          description: 'Authenticated caller is not permitted, or protection blocked the request. Inspect the response errorCode and correlationId.'
        '429':
          description: Gateway rate limit exceeded. Respect Retry-After when supplied.
      security:
        - EntraBearer: [ ]
  /api/v1/agent-runtime/readiness:
    get:
      tags:
        - AgentRuntime
      summary: Check agent credential access
      description: "Returns 204 when this agent credential passes authentication and admission. This is not proof of Purview enforcement or telemetry delivery.\n\nAuthorization policy: ExternalAgentOnly."
      operationId: AgentRuntime.GetReadiness
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Gateway rate limit exceeded. Respect Retry-After when supplied.
      security:
        - AgentKey: [ ]
  /api/v1/agents:
    post:
      tags:
        - Agents
      summary: Register an external agent
      description: "Creates a registration and queues provisioning. Save the returned one-time credential securely. A 202 response is not Active. If the response is lost, reconcile using the exact externalAgentId instead of blindly creating another registration.\n\nAuthorization policy: AdministratorOnly."
      operationId: Agents.RegisterAgent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAgentRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/RegisterAgentRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/RegisterAgentRequest'
        required: true
      responses:
        '202':
          description: Accepted
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/RegisterAgentResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterAgentResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/RegisterAgentResponse'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            text/plain:
              schema:
