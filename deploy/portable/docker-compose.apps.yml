# Workload overlay for portable bootstrap (API + Worker + React Console).
# Infra services stay in docker-compose.yml.
# Runtime secrets/config are loaded from .env.runtime written by bootstrap apply.
services:
  api:
    image: ${GATEWAY_API_IMAGE:-a365-gateway-api:dev}
    env_file:
      - .env.runtime
    ports:
      - "${GATEWAY_API_HOST_PORT:-5080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Portable}
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Portable}
      Infrastructure__Provider: Portable
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      s3:
        condition: service_healthy

  worker:
    image: ${GATEWAY_WORKER_IMAGE:-a365-gateway-worker:dev}
    env_file:
      - .env.runtime
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Portable}
      Infrastructure__Provider: Portable
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started

  console:
    image: ${GATEWAY_CONSOLE_IMAGE:-a365-gateway-console:dev}
    ports:
      - "${GATEWAY_CONSOLE_HOST_PORT:-5081}:8080"
    environment:
      GATEWAY_API_ORIGIN: http://api:8080
      GATEWAY_API_HOST: api
      CONSOLE_CLIENT_ID: ${CONSOLE_CLIENT_ID}
      CONSOLE_TENANT_ID: ${CONSOLE_TENANT_ID}
      CONSOLE_API_SCOPE: ${CONSOLE_API_SCOPE}
      CONSOLE_USE_MOCK: "false"
    depends_on:
      api:
        condition: service_started
