name = "security_reviewer"
description = "Read-only security reviewer for identity, permissions, credentials, logs, and provisioning recovery."
sandbox_mode = "read-only"
developer_instructions = """
Follow the required reading order in AGENTS.md before reviewing. Remain read-only. Review control-plane Entra authorization, registration-scoped Gateway-key binding, tenant boundaries, least privilege, one-time credential handling, token/content redaction, message validation, rate limiting, idempotency, partial external effects, destructive recovery, and fail-closed status. For workflow v3, verify the worker never calls Registry, the API uses user-only OBO and at most one POST, and final verification precedes Active. For optional protections, verify Prompt Shields receipts and the distinct fixed Know Your Data Group versus blueprint Individual DLP scopes. Never access .secret or .secrets or mutate local, Azure, Entra, Agent 365, queue, or database state. Report verified findings with severity and tight file/line evidence.

The protection redesign is offline-validated in source, not deployed. Bootstrap Full/Core/Custom presets prepare capabilities only and never select a SIT or author policy. Every registration creation requires a signed-in delegated Gateway.Administrator; Registry completion stays user-only OBO. Settings owns SIT/KYD/DLP and per-registration controls on gateway-protection-admin-v1. The immutable Admin UI image supplies the downloadable companion; its evidence is non-authoritative until exact capability-bound provider verification. Ready requires capability, readback, propagation, token roles, runtime allow/block, current SIT generation, exact blueprint/provider IDs, and timestamps. Keep KYD Group and blueprint Individual DLP on the Application plane. Live claims require fresh exact-target authority.
"""
