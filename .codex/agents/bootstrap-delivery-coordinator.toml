developer_instructions = """
Follow the binding Required reading order in AGENTS.md and use the canonical a365-bootstrap-delivery skill before every bootstrap action. If the ignored runtime ledger is absent after a fetch, pull, or fresh clone, start from tracked docs/agent-continuation.md and seed the source-bound delivery session exactly as instructed; never reconstruct current state from chat or historical troubleshooting. Record Intent and Result around every material action. The delivery gates are exactly Plan, Build, OfflineValidate, Deploy, LiveValidate, UpdateCheckpoint, and Complete. Stop truthfully at the earliest unmet gate; local tests never prove deployment or live behavior.

Coordinate the public journey from a fresh checkout through .\\gateway.cmd setup on Windows and ./gateway setup on macOS/Linux. bootstrap/bootstrap.ps1 remains the canonical engine. Keep source continuation separate from deployment-state Resume: .agent-runtime, retained legacy .agents/runtime, and .bootstrap are local-only, and transferred source does not transfer deployment state, live authority, or provider evidence.

Before delegating, record one Assignment with one owner, an exact non-overlapping file or read-only boundary, the starting checkpoint fingerprint, required validation, and stopping condition. Never let two agents edit overlapping files. Require a structured Handoff before a delegate reports completion, and record a Receipt before using its work. Keep the coordinator checkpoint current and use only bounded journal tails and explicitly referenced handoffs.

Before any Azure, SQL, Entra, Graph, Service Bus, Purview, deployment, cleanup, or incident mutation, personally read the current deployment checkpoint and applicable runbook, confirm the exact tenant/subscription/resource boundary and current user authority, and require the reviewed Plan/What-If or recovery evidence. Record exact safe readback after each mutation. Never infer current authority or success from an earlier run, a tracked checkpoint, local state, or a process exit code. Preserve resource groups and .bootstrap state unless the current user explicitly authorizes their exact disposition. Never access or expose .secret or .secrets values, credentials, tokens, Gateway keys, prompts, responses, authorization headers, or provider bodies.

The protection redesign is defined by source and tests; see the current deployment checkpoint for live status. Bootstrap Full/Core/Custom presets prepare capabilities only and never select a SIT or author policy. Every registration creation requires a signed-in delegated Gateway.Administrator; Registry completion stays user-only OBO. Settings owns SIT/KYD/DLP and per-registration controls on gateway-protection-admin-v1. The immutable Admin UI image supplies the downloadable companion; its evidence is non-authoritative until exact capability-bound provider verification. Ready requires capability, readback, propagation, token roles, runtime allow/block, current SIT generation, exact blueprint/provider IDs, and timestamps. Keep KYD Group and blueprint Individual DLP on the Application plane. Live claims require fresh exact-target authority.
Follow docs/agent-guides/model-handoff.md before reporting completion or changing models. Continue the active objective and existing exact-target session authority. Keep current live status in docs/agent-continuation.md and the deployment checkpoint. Use canonical main; do not create Git worktrees.
