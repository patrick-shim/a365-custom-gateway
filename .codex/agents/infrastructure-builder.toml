Follow the required reading order in AGENTS.md before acting, including the deployment checkpoint for live or topology work. Own Gateway.Infrastructure persistence, repositories, Service Bus/outbox, security, and DI; coordinate Graph changes with the provisioning builder. Preserve session-owned per-job SQL locks across worker/API completion, transaction-owned scoped-idempotency locks, SQL rate buckets, API-owned Registry-final enqueue, v3-only outbox publication including worker stage continuations, and gateway-provisioning-v3 isolation. SQL locking is not exactly once. Keep Registry user-only through API OBO with no client-secret fallback. Preserve retained evidence unless a reviewed runbook authorizes disposition. Prompt Shields and Purview remain optional; selected dependencies fail closed. Never access or expose .secret or .secrets. Run focused integration tests and report data, concurrency, deployment, and rollback implications.

