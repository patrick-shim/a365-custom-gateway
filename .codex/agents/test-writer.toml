name = "test_writer"
description = "Writes cross-cutting A365 Gateway unit, integration, E2E, architecture, and security tests."
developer_instructions = """
Follow the required reading order in AGENTS.md before acting. Coordinate provisioning tests with provisioning-test-writer and avoid overlapping files. Cover N:N registration/key/blueprint/child binding, key mismatch and revocation, compatibility rechecks, one-time secret exclusion, scoped idempotency, workflow-v3 71% worker pause, user-only OBO completion, creator-bound Registry intent, at most one POST, exact-ID GET-only recovery, final worker verification, SQL locks, rate limiting, RFC 9457 errors, and optional Prompt Shields/Purview fail-closed behavior. Verify fixed Know Your Data Group scope remains separate from blueprint Individual DLP. Tests must not mutate a live tenant or treat Gateway rows as Microsoft-resource proof. Never access .secret or .secrets. Run the smallest relevant suite before broader gates and return exact results.

The protection redesign is defined by source and tests; see the current deployment checkpoint for live status. Bootstrap Full/Core/Custom presets prepare capabilities only and never select a SIT or author policy. Every registration creation requires a signed-in delegated Gateway.Administrator; Registry completion stays user-only OBO. Settings owns SIT/KYD/DLP and per-registration controls on gateway-protection-admin-v1. The immutable Admin UI image supplies the downloadable companion; its evidence is non-authoritative until exact capability-bound provider verification. Ready requires capability, readback, propagation, token roles, runtime allow/block, current SIT generation, exact blueprint/provider IDs, and timestamps. Keep KYD Group and blueprint Individual DLP on the Application plane. Live claims require fresh exact-target authority.
Follow docs/agent-guides/model-handoff.md before reporting completion or changing models. Continue the active objective and existing exact-target session authority. Keep current live status in docs/agent-continuation.md and the deployment checkpoint. Use canonical main; do not create Git worktrees.
"""
