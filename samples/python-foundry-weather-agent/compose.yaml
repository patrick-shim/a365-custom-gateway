name: a365-weather-agent-sample

services:
  weather-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    image: a365-weather-mcp:local
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 5091
      WEATHER_TIMEOUT_SECONDS: ${WEATHER_TIMEOUT_SECONDS:-10}
    ports:
      - "127.0.0.1:5091:5091"
    restart: unless-stopped
    init: true
    cpus: 0.50
    mem_limit: 256m
    mem_reservation: 64m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5091/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
