[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "a365-foundry-weather-agent"
version = "0.1.0"
description = "Standalone Flask, Foundry, MCP, and Gateway integration sample"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<4",
  "aiohttp>=3.12,<4",
  "azure-identity>=1.25,<2",
  "httpx>=0.28,<1",
  "mcp>=2.3,<3",
  "openai>=2,<3",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10"]

[tool.setuptools.packages.find]
include = ["weather_agent*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
